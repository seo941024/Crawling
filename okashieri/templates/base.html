<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}오카시에리 - 일본 과자 가격 비교{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="icon-btn nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <a class="logo" href="{{ url_for('start') }}" aria-label="오카시에리 시작 화면">오카시<span>에리</span></a>

      <nav id="site-nav" class="nav" aria-label="주요 메뉴">
        <a href="{{ url_for('start') }}" data-nav>홈</a>
        <a href="{{ url_for('index') }}" data-nav>상품</a>
        <a href="{{ url_for('about') }}" data-nav>소개</a>
      </nav>

      <form class="searchbar" action="{{ url_for('index') }}" method="get" role="search">
        <input id="q" name="q" type="search" placeholder="이름이나 초성으로 검색 (예: 킷캣, ㅋㅋ)" autocomplete="off" aria-label="상품 검색">
      </form>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer>상품 정보는 각 쇼핑몰에서 수집한 시점의 가격이며 실제와 다를 수 있습니다. 구매 전에 상품 페이지에서 확인하시기 바랍니다.</footer>

  <script src="{{ url_for('static', filename='nav.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
