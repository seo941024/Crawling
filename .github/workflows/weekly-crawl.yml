name: weekly-crawl

# 매주 일요일 새벽 3시(한국 시간)에 수집한다. UTC 기준으로는 토요일 18시이다.
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch: {}   # Actions 화면에서 수동 실행도 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: okashieri/requirements.txt

      - name: 패키지 설치
        run: pip install -r okashieri/requirements.txt

      # 1) 쇼핑몰별로 robots.txt부터 확인한 뒤 수집한다. 각 스크립트는 끝까지 성공했을 때만 CSV를 교체한다.
      #    코코재팬은 GitHub 서버 주소에서 접속이 막히므로(robots.txt 403), 막히면 건너뛰고
      #    저장소에 올려 둔 기존 CSV를 쓴다(코코재팬 갱신은 PC에서 수집해 올린다).
      - name: 코코재팬 (접속이 막히면 건너뜀)
        run: |
          if python check_robots.py 코코재팬; then
            python crawl_coco.py
          else
            echo "::warning::코코재팬은 접속이 허용되지 않아 건너뜁니다. 저장소의 기존 CSV를 사용합니다."
          fi
      - name: 엔핍 (robots.txt 확인 후 Selenium 수집)
        run: |
          python check_robots.py 엔핍
          python crawl_nppip.py
      - name: 이로이로도쿄 (robots.txt 확인 후 수집)
        run: |
          python check_robots.py 이로이로도쿄
          python crawl_iroiro.py

      # 3) 새 DB를 따로 만든다(운영 DB는 건드리지 않는다).
      - name: 새 DB 생성
        run: |
          mkdir -p okashieri/static/images
          python okashieri/build_db.py okashieri/okashieri_new.db

      # 4) 상품이 비정상적으로 적으면 실패 처리해서 부분 수집 결과가 결과물로 올라가지 않게 한다.
      - name: DB 검증
        run: |
          python - <<'EOF'
          import sqlite3
          n = sqlite3.connect("okashieri/okashieri_new.db").execute("select count(*) from products").fetchone()[0]
          print("상품 수:", n)
          assert n >= 3000, "상품 수가 너무 적습니다. 수집이 중간에 끊겼을 수 있습니다."
          EOF

      # 5) 이미지는 용량 때문에 제외하고 DB와 CSV만 보관한다.
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-data
          path: |
            okashieri/okashieri_new.db
            Coco_Product_Information.csv
            Nppip_Product_Information.csv
            IroiroTokyo_Product_Information.csv
          retention-days: 30
