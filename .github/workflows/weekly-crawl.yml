name: weekly-crawl

# 매주 일요일 새벽 3시(한국 시간)에 수집한다. UTC 기준으로는 토요일 18시이다.
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch: {}   # Actions 화면에서 수동 실행도 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: okashiro/requirements.txt

      - name: 패키지 설치
        run: pip install -r okashiro/requirements.txt

      # 1) 수집 전에 robots.txt부터 확인한다. 허용되지 않으면 이후 단계는 실행되지 않는다.
      - name: robots.txt 확인
        run: python check_robots.py

      # 2) 쇼핑몰별 수집. 각 스크립트는 끝까지 성공했을 때만 CSV를 교체한다.
      - name: 코코재팬 수집
        run: python crawl_coco.py
      - name: 엔핍 수집 (Selenium)
        run: python crawl_nppip.py
      - name: 이로이로도쿄 수집
        run: python crawl_iroiro.py

      # 3) 새 DB를 따로 만든다(운영 DB는 건드리지 않는다).
      - name: 새 DB 생성
        run: |
          mkdir -p okashiro/static/images
          python okashiro/build_db.py okashiro/okashiro_new.db

      # 4) 상품이 비정상적으로 적으면 실패 처리해서 부분 수집 결과가 결과물로 올라가지 않게 한다.
      - name: DB 검증
        run: |
          python - <<'EOF'
          import sqlite3
          n = sqlite3.connect("okashiro/okashiro_new.db").execute("select count(*) from products").fetchone()[0]
          print("상품 수:", n)
          assert n >= 3000, "상품 수가 너무 적습니다. 수집이 중간에 끊겼을 수 있습니다."
          EOF

      # 5) 이미지는 용량 때문에 제외하고 DB와 CSV만 보관한다.
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-data
          path: |
            okashiro/okashiro_new.db
            Coco_Product_Information.csv
            Nppip_Product_Information.csv
            IroiroTokyo_Product_Information.csv
          retention-days: 30
